name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BACKEND_SERVICE: backend
  IMAGE_NAME: ghcr.io/${{ github.repository }}/backend

jobs:
  # Detecta qué carpetas cambiaron para no correr jobs innecesarios
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  backend:
    name: Backend (Docker Compose)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # El compose exige estas variables (${VAR:?}) incluso para `docker compose build`
      RABBITMQ_USER: ci
      RABBITMQ_PASSWORD: ci
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Crear .env a partir del ejemplo (si existe)
        run: |
          if [ -f env-example ] && [ ! -f .env ]; then cp env-example .env; fi

      - name: Build de imágenes (compose)
        run: docker compose build

      - name: Build de la imagen de pruebas (stage test)
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: test
          load: true
          push: false
          tags: backend-test:ci
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,scope=backend-test,mode=max

      # Ruff corre en el runner: no hace falta tenerlo dentro de la imagen
      - name: Lint (ruff)
        uses: astral-sh/ruff-action@v3
        with:
          src: backend
          args: check

      - name: Tests (pytest)
        run: |
          mkdir -p reports
          # pytest devuelve 5 cuando no encuentra tests; lo toleramos por ahora
          set +e
          docker run --rm \
            -v "$PWD/reports:/app/reports" \
            backend-test:ci \
            pytest -q --junitxml=reports/junit.xml
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::warning::No hay tests en el backend todavía"
            exit 0
          fi
          exit $code

      - name: Logs de compose si algo falla
        if: failure()
        run: docker compose logs --no-color

      - name: Limpiar contenedores
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend (React Native)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Tests
        run: npm test --if-present

  publish-backend:
    name: Publicar imagen del backend
    needs: [changes, backend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadatos y tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max