
services:
  backend:
    build:
      context: .
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app,z
    env_file:
      - .env
    environment:
      PORT: "8000"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_network

  ai_worker:
    build:
      context: .
    container_name: ai_worker
    command:
      - python
      - -m
      - src.infrastructure.messaging.ai_worker
    volumes:
      - .:/app,z
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - internal_network

  event_worker:
    build:
      context: .
    container_name: event_worker
    command:
      - python
      - -m
      - src.events.run_ai_events_worker
    volumes:
      - .:/app,z
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: billigcart-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal_network

  ollama:
    image: ollama/ollama
    container_name: ollama
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - internal_network

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:270m}
    command:
      - sh
      - -c
      - |
        echo "Esperando a que Ollama esté disponible..."
        until curl -fsS http://ollama:11434/api/tags >/dev/null; do
          sleep 3
        done
        echo "Descargando el modelo $${OLLAMA_MODEL}..."
        curl --fail --show-error -sS \
          -X POST http://ollama:11434/api/pull \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$${OLLAMA_MODEL}\"}"
        echo "Descarga finalizada."
    restart: "no"
    networks:
      - internal_network

networks:
  internal_network:
    driver: bridge

volumes:
  ollama:
