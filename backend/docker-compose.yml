services:
  backend:
    build:
      context: .
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app,z
    environment:
      - PORT=8000
    restart: unless-stopped
    networks:
        - internal_network
  ollama:
    image: ollama/ollama
    container_name: ollama
    expose:
      - 11434
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
        - internal_network
networks:
  internal_network:
    driver: bridge

volumes:
  ollama: