
services:
  backend:
    build: .
    container_name: backend
    labels:
    - "traefik.enable=true"
    - "traefik.http.routers.backend.entrypoints=web"
    - "traefik.http.routers.backend.rule=PathPrefix(`/api`) || PathPrefix(`/docs`) || PathPrefix(`/openapi`)"
    - "traefik.http.services.backend.loadbalancer.server.port=8000"
    - "traefik.http.routers.backend.middlewares=api-strip"
    - "traefik.http.middlewares.api-strip.stripprefix.prefixes=/api"
    volumes:
      - .:/app
      - payment-journal:/payment-data
    env_file:
      - .env
    environment:
      PORT: "8000"
      PAYMENTS_JOURNAL_PATH: /payment-data/journal.sqlite3
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_network

  ai_worker:
    build: .
    container_name: ai_worker
    command:
      - python
      - -m
      - src.infrastructure.messaging.ai_worker
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    networks:
      - internal_network

  event_worker:
    build: .
    container_name: event_worker
    command:
      - python
      - -m
      - src.events.run_ai_events_worker
    volumes:
      - .:/app
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_network

  payment_worker:
    build: .
    command: ["python", "-m", "src.infrastructure.payments.worker"]
    volumes:
      - .:/app
      - payment-journal:/payment-data
    env_file: .env
    environment:
      PAYMENTS_JOURNAL_PATH: /payment-data/journal.sqlite3
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - internal_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: billigcart-rabbitmq
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    expose:
      - "5672"
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Define RABBITMQ_PASSWORD en .env}
    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - internal_network

  ollama:
    image: ollama/ollama
    container_name: ollama
    expose:
      - "11434"
    volumes:
      - ollama:/root/.ollama
    networks:
      - internal_network

    # Configuracion para GPU
           

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      - ollama
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma3:270m}
    command:
      - sh
      - -c
      - |
        echo "Esperando a que Ollama esté disponible..."
        until curl -fsS http://ollama:11434/api/tags >/dev/null; do
          sleep 3
        done
        echo "Descargando el modelo $${OLLAMA_MODEL}..."
        curl --fail --show-error -sS \
          -X POST http://ollama:11434/api/pull \
          -H "Content-Type: application/json" \
          -d "{\"name\":\"$${OLLAMA_MODEL}\"}"
        echo "Descarga finalizada."
    restart: "no"
    networks:
      - internal_network
  traefik:
    image: traefik:v3.7.16
    container_name: traefik_proxy
    restart: unless-stopped
    command:
      - "--api.insecure=true"   # aceptable solo si el puerto va a 127.0.0.1
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.endpoint=tcp://socket-proxy:2375"
      - "--entrypoints.web.address=:80"

    ports:
      - "80:80"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    networks:
      - internal_network
      - socket_network
    depends_on:
      - socket-proxy

  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: socket_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt:
      - label:disable
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /run
      - /tmp
    networks:
      - socket_network

  gps_service:
    build: .
    container_name: gps_service
    command: >
      uvicorn src.infrastructure.gps.app:app
      --host 0.0.0.0 --port 8001
      --ws-ping-interval 20 --ws-ping-timeout 20
    restart: unless-stopped
    env_file: .env   # RABBITMQ_URL, SUPABASE_URL, SUPABASE_SERVICE_KEY, SUPABASE_JWT_SECRET
    expose:
      - "8001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    networks:
      - internal_network       # Traefik -> gps_service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gps.rule=PathPrefix(`/ws`)"
      - "traefik.http.routers.gps.entrypoints=web"
      - "traefik.http.services.gps.loadbalancer.server.port=8001"
      - "traefik.docker.network=proxy_network"
    depends_on:
      rabbitmq:
        condition: service_healthy

networks:
  internal_network:
    driver: bridge
  socket_network:
    internal: true

volumes:
  ollama:
  rabbitmq-data:
  payment-journal:
